<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سفارش غذا</title>
<style>
:root{--d:#111827;--g:#22c55e;--b:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font:15px Tahoma,Arial,sans-serif;color:var(--d)}
.app{max-width:600px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px}
header{background:var(--d);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
.p{padding:16px}
.card{border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--d);color:#fff}
button.g{background:var(--g)}
button.o{background:#fff;color:var(--d);border:1px solid var(--b)}
.w{width:100%}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px;font:inherit;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.cats button{white-space:nowrap;background:#f3f4f6;color:var(--d)}
.cats .on{background:var(--d);color:#fff}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;padding:12px;background:#fff;border-top:1px solid var(--b)}
.tag{padding:4px 10px;border-radius:8px;background:#dcfce7;color:#166534;font-size:12px}
small{color:#6b7280}
</style>
</head>
<body>
<div class="app">
<header><b id="br"></b><span id="who"></span></header>
<div id="v"></div>
</div>

<script>
/* ===== تنظیمات: فقط این بخش را ویرایش کن ===== */
const BRAND = "سفارش‌یار";          // اسم برند جدید (اسم TabPay را عوض کن)
const FIREBASE_URL = "";            // مثال: "https://myproject-default-rtdb.firebaseio.com"  (خالی = حالت دمو)
const PANEL_PIN = "1234";           // رمز پنل رستوران؛ حتما عوضش کن
const DEMO = true;                  // دکمه میز آزمایشی؛ قبل از راه‌اندازی واقعی false کن
const RESTAURANTS = {               // هر رستوران یک کد دارد (مثلا demo)
  demo: { name: "کافه نمونه", menu: [
    { id: 1, cat: "نوشیدنی", name: "قهوه اسپرسو", price: 80000, icon: "☕" },
    { id: 2, cat: "نوشیدنی", name: "چای ماسالا", price: 70000, icon: "🍵" },
    { id: 3, cat: "غذا", name: "برگر", price: 250000, icon: "🍔" },
    { id: 4, cat: "غذا", name: "پیتزا", price: 300000, icon: "🍕" },
    { id: 5, cat: "دسر", name: "چیزکیک", price: 150000, icon: "🍰" }
  ]}
};
/* ============================================== */

const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("fa-IR") + " تومان";
const ST = ["دریافت شد", "در حال آماده‌سازی", "آماده سرو", "تحویل داده شد"];
let R, T, cart = {}, cat = "", tm;

/* لایه داده: Firebase (REST) یا حافظه مرورگر برای دمو */
const DB = {
  async menu(rid) {
    const d = !FIREBASE_URL ? JSON.parse(localStorage.getItem("m_" + rid) || "null")
      : await (await fetch(`${FIREBASE_URL}/menus/${rid}.json`)).json();
    return d || RESTAURANTS[rid].menu;
  },
  async saveMenu(rid, m) {
    if (!FIREBASE_URL) return localStorage.setItem("m_" + rid, JSON.stringify(m));
    await fetch(`${FIREBASE_URL}/menus/${rid}.json`, { method: "PUT", body: JSON.stringify(m) });
  },
  async all(rid) {
    if (!FIREBASE_URL) return JSON.parse(localStorage.getItem("o_" + rid) || "{}");
    return (await (await fetch(`${FIREBASE_URL}/orders/${rid}.json`)).json()) || {};
  },
  async one(rid, id) {
    if (!FIREBASE_URL) return (await this.all(rid))[id];
    return (await fetch(`${FIREBASE_URL}/orders/${rid}/${id}.json`)).json();
  },
  async put(o) {
    if (!FIREBASE_URL) {
      const a = await this.all(o.rid); a[o.id] = o;
      localStorage.setItem("o_" + o.rid, JSON.stringify(a)); return;
    }
    await fetch(`${FIREBASE_URL}/orders/${o.rid}/${o.id}.json`, { method: "PUT", body: JSON.stringify(o) });
  }
};

/* ---------- مشتری ---------- */
function landing() {
  $("v").innerHTML = `<div class="p"><h2>به ${BRAND} خوش آمدید</h2>
  <p>QR روی میز را با دوربین گوشی اسکن کنید تا منو باز شود.</p>
  ${DEMO ? `<button class="g w" onclick="location.href='?r=demo&t=1'">باز کردن میز آزمایشی</button>` : ""}</div>`;
}
const total = () => R.menu.reduce((s, m) => s + (cart[m.id] || 0) * m.price, 0);
function chg(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  menu();
}
function menu() {
  clearInterval(tm);
  const cats = [...new Set(R.menu.map(m => m.cat))];
  cat = cat || cats[0];
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  const cur = localStorage.getItem("cur");
  $("v").innerHTML = `<div class="p">
  ${cur ? `<button class="o w" style="margin-bottom:12px" onclick="track()">📦 پیگیری سفارش قبلی</button>` : ""}
  <div class="cats">${cats.map(c => `<button class="${c == cat ? "on" : ""}" onclick="cat='${c}';menu()">${c}</button>`).join("")}</div>
  ${R.menu.filter(m => m.cat == cat).map(m => `<div class="card row">
    <div>${esc(m.icon)} <b>${esc(m.name)}</b><br><small>${fmt(m.price)}</small></div>
    <div class="row">${cart[m.id] ? `<button class="o" onclick="chg(${m.id},-1)">−</button><b>${cart[m.id]}</b>` : ""}
    <button class="g" onclick="chg(${m.id},1)">+</button></div></div>`).join("")}</div>
  ${n ? `<div class="bar"><button class="g w" onclick="checkout()">مشاهده سبد (${n}) · ${fmt(total())}</button></div>` : ""}`;
}
function checkout() {
  const rows = R.menu.filter(m => cart[m.id]).map(m =>
    `<div class="row"><span>${esc(m.name)} × ${cart[m.id]}</span><span>${fmt(m.price * cart[m.id])}</span></div>`).join("");
  $("v").innerHTML = `<div class="p"><div class="card">${rows}<hr><div class="row"><b>جمع</b><b>${fmt(total())}</b></div></div>
  <input id="nm" maxlength="40" placeholder="نام (اختیاری)">
  <textarea id="nt" maxlength="200" placeholder="یادداشت برای آشپزخانه"></textarea>
  <p><small>پرداخت: حضوری در رستوران</small></p>
  <button class="g w" onclick="send()">ثبت سفارش</button><br><br>
  <button class="o w" onclick="menu()">بازگشت</button></div>`;
}
async function send() {
  const items = R.menu.filter(m => cart[m.id]).map(m => ({ n: m.name, q: cart[m.id], p: m.price }));
  if (!items.length) return;
  const o = { id: Date.now().toString(36), rid: R.id, t: T, items, total: total(),
    note: $("nt").value, name: $("nm").value, st: 0, at: Date.now() };
  try {
    await DB.put(o);
    localStorage.setItem("cur", JSON.stringify({ rid: o.rid, id: o.id }));
    cart = {}; track();
  } catch (e) { alert("ثبت سفارش انجام نشد. اینترنت را بررسی کنید."); }
}
function track() {
  clearInterval(tm);
  const c = JSON.parse(localStorage.getItem("cur") || "null");
  if (!c) return menu();
  const draw = async () => {
    const o = await DB.one(c.rid, c.id);
    if (!o) return;
    $("v").innerHTML = `<div class="p"><div class="card">سفارش <b>${esc(o.id)}</b> · میز ${esc(o.t)}<hr>${o.items.map(i => `<div class="row"><span>${esc(i.n)} × ${i.q}</span><span>${fmt(i.p * i.q)}</span></div>`).join("")}<hr><div class="row"><b>صورتحساب</b><b>${fmt(o.total)}</b></div></div>
    ${ST.map((s, i) => `<div class="card row"><span>${s}</span><span class="tag">${i < o.st ? "✓" : i == o.st ? "●" : "–"}</span></div>`).join("")}
    <button class="o w" onclick="menu()">بازگشت به منو</button></div>`;
  };
  draw(); tm = setInterval(draw, 4000);
}

/* ---------- پنل رستوران ---------- */
function panelLogin(rid) {
  if (sessionStorage.pin == PANEL_PIN) return panel(rid);
  $("v").innerHTML = `<div class="p"><input id="pn" type="password" placeholder="رمز پنل">
  <button class="w" onclick="if($('pn').value==PANEL_PIN){sessionStorage.pin=PANEL_PIN;panel('${rid}')}else alert('رمز اشتباه است')">ورود</button></div>`;
}
async function adv(rid, id) {
  const o = await DB.one(rid, id);
  if (o && o.st < 3) { o.st++; await DB.put(o); }
}
function panelOrders(rid) {
  const draw = async () => {
    const a = Object.values(await DB.all(rid)).sort((x, y) => y.at - x.at);
    $("pc").innerHTML = `<div class="p">${a.length ? a.map(o => `<div class="card">
      <div class="row"><b>میز ${esc(o.t)}</b><span class="tag">${ST[o.st]}</span></div>
      ${o.items.map(i => `<div>${esc(i.n)} × ${i.q}</div>`).join("")}
      ${o.name ? `<small>👤 ${esc(o.name)}</small><br>` : ""}${o.note ? `<small>📝 ${esc(o.note)}</small>` : ""}
      <div class="row" style="margin-top:8px"><b>${fmt(o.total)}</b>
      ${o.st < 3 ? `<button class="g" onclick="adv('${rid}','${o.id}')">${ST[o.st + 1]}</button>` : ""}</div></div>`).join("") : "هنوز سفارشی نیست."}</div>`;
  };
  clearInterval(tm); draw(); tm = setInterval(draw, 4000);
}
function panel(rid) {
  $("who").textContent = "پنل · " + RESTAURANTS[rid].name;
  $("v").innerHTML = `<div class="p row" style="padding-bottom:0"><button class="w" onclick="panelOrders('${rid}')">📋 سفارش‌ها</button><button class="o w" onclick="panelMenu('${rid}')">🍽️ منو</button></div><div id="pc"></div>`;
  panelOrders(rid);
}
async function panelMenu(rid) {
  clearInterval(tm);
  const m = await DB.menu(rid);
  $("pc").innerHTML = `<div class="p">
  ${m.map((x, i) => `<div class="card row"><span>${esc(x.icon)} ${esc(x.name)} · ${fmt(+x.price)}</span><button class="o" onclick="delItem('${rid}',${i})">🗑️</button></div>`).join("")}
  <div class="card"><b>غذای جدید</b><br><br><input id="fn" placeholder="نام غذا"><input id="fp" type="number" placeholder="قیمت (تومان)"><input id="fc" placeholder="دسته‌بندی (مثلا غذا)"><input id="fi" placeholder="ایموجی مثلا 🍝"><button class="g w" onclick="addItem('${rid}')">افزودن به منو</button></div></div>`;
}
async function addItem(rid) {
  const m = await DB.menu(rid), n = $("fn").value.trim(), p = +$("fp").value;
  if (!n || !p) return alert("نام و قیمت را وارد کنید");
  const c = $("fc").value.replace(/[<>"'&\\]/g, "").trim() || "غذا";
  m.push({ id: Date.now(), cat: c, name: n, price: p, icon: $("fi").value.trim() || "🍽️" });
  await DB.saveMenu(rid, m); panelMenu(rid);
}
async function delItem(rid, i) {
  const m = await DB.menu(rid); m.splice(i, 1);
  await DB.saveMenu(rid, m); panelMenu(rid);
}

/* ---------- شروع ---------- */
(function init() {
  $("br").textContent = BRAND;
  document.title = BRAND + " | سفارش غذا";
  const pr = P.get("panel");
  if (pr && RESTAURANTS[pr]) return panelLogin(pr);
  const rid = P.get("r"), t = P.get("t");
  if (!RESTAURANTS[rid] || !/^\d{1,3}$/.test(t || "")) return landing();
  R = { ...RESTAURANTS[rid], id: rid }; T = t;
  $("who").textContent = R.name + " · میز " + T;
  DB.menu(rid).then(m => { R.menu = m; menu(); }).catch(menu);
})();
</script>
</body>
</html>
